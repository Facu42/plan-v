<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu enlace para entrar · Nutridash</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Poppins,Arial,sans-serif;color:#272932;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px 24px;font-size:15px;line-height:1.5;">
    <p style="margin:0 0 16px;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#6b6d75;">Nutridash</p>
    <p>Hola,</p>
    <p>Usá este enlace para entrar a Nutridash. No hace falta clave. El enlace vence en unos minutos.</p>
    <p style="margin:24px 0;">
      <a href="{{ .ConfirmationURL }}" style="background:#c5e46d;color:#272932;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:600;">Entrar a Nutridash</a>
    </p>
    <p>Si el botón no abre, copiá este enlace:</p>
    <p style="word-break:break-all;font-size:13px;color:#6b6d75;">{{ .ConfirmationURL }}</p>
    <p style="color:#6b6d75;font-size:12px;margin-top:28px;">Nutridash · Este mail se mandó automáticamente. Si no lo pediste, podés ignorarlo.</p>
  </div>
</body>
</html>
