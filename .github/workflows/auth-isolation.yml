name: Aislamiento con sesiones firmadas
on:
  push:
    paths:
      - '.github/workflows/auth-isolation.yml'
      - 'scripts/test-auth-isolation.mjs'
      - 'vitest.auth-isolation.config.ts'
      - 'supabase/auth-isolation/**'
      - 'supabase/migrations/**'
      - 'server/security/signed-auth.local.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:auth-isolation

