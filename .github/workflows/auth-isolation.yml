name: Aislamiento con sesiones firmadas
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth-isolation.yml'
      - 'scripts/test-auth-isolation.mjs'
      - 'scripts/product-browser.local.mjs'
      - 'supabase/**'
      - 'server/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite*.ts'
      - 'vitest*.ts'
  pull_request:
    paths:
      - '.github/workflows/auth-isolation.yml'
      - 'scripts/test-auth-isolation.mjs'
      - 'scripts/product-browser.local.mjs'
      - 'supabase/**'
      - 'server/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite*.ts'
      - 'vitest*.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-auth-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  signed-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Preparar navegador gstack sin capturas
        run: |
          git clone https://github.com/garrytan/gstack.git "$RUNNER_TEMP/plan-v-gstack"
          git -C "$RUNNER_TEMP/plan-v-gstack" checkout dedfe42ef00908171055b120734380650757b9b1
          cd "$RUNNER_TEMP/plan-v-gstack"
          bun install --frozen-lockfile
          mkdir -p browse/dist
          bun build browse/src/cli.ts --compile --outfile browse/dist/browse
          bunx playwright install --with-deps chromium
          echo "PLANV_GSTACK_CLI=$RUNNER_TEMP/plan-v-gstack/browse/dist/browse" >> "$GITHUB_ENV"
      - run: npm run test:auth-isolation
        env:
          PLANV_PRODUCT_BROWSER: '1'
          PLANV_SECURITY_EVIDENCE_DIR: ${{ runner.temp }}/planv-security-advisors
      - name: Guardar advisors de la base de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-view-advisors
          path: ${{ runner.temp }}/planv-security-advisors
          if-no-files-found: ignore

